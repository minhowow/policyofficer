# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
apiVersion: policyofficer/test-0.1
rule: kr.hiring-act.4-3/applicant-family-fields
cases:
  - file: hiring-4-3/family-violating.ts
    note: 지원자 스키마가 부모의 직업·학력과 가족 재산을 받는다. 제3호의 전형적인 모양이다
    expect: needs-review
    ai: {ai-family-job-required: no}

  - file: hiring-4-3/family-job-required.ts
    note: 동반 가족 비자 요건인 공고에서만 조건부로 받는다
    expect: compliant
    ai:
      ai-family-job-required:
        answer: yes
        cite: 'parentJob: jobRequiresFamilyVisa ? z.string() : z.undefined(),'

  - file: hiring-4-3/family-gate-name-only.ts
    note: 직무 필요라는 이름만 두고 가족 항목은 모든 지원자에게 받는다. 약한 근거다
    expect: needs-review
    ai: {ai-family-job-required: no}

  - file: hiring-4-3/family-emergency-contact.ts
    note: 함정 — 비상연락망이다. 가족의 학력·직업·재산을 받지 않는다
    expect: not-applicable
