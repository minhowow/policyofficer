# yaml-language-server: $schema=../../../schemas/policy-test-0.1.json
apiVersion: policyofficer/test-0.1
rule: kr.hiring-act.4-3/applicant-origin-marital-asset-fields
cases:
  - file: hiring-4-3/origin-violating.tsx
    note: 출신지역과 혼인여부를 모든 지원자에게 받는다. 제2호의 전형적인 모양이다
    expect: needs-review
    ai: {ai-origin-job-required: no}

  - file: hiring-4-3/origin-job-required.tsx
    note: 거주지 요건이 직무 요건인 공고에서만 조건부로 받는다
    expect: compliant
    ai:
      ai-origin-job-required:
        answer: yes
        cite: '{jobRequiresResidency && <input name="hometown" placeholder="거주 지역" />}'

  - file: hiring-4-3/origin-gate-name-only.tsx
    note: 블라인드 채용이라는 낱말만 있고 칸은 그대로 받는다. 약한 근거라 혼자 풀지 못한다
    expect: needs-review
    ai: {ai-origin-job-required: no}

  - file: hiring-4-3/origin-shipping-address.ts
    note: 함정 — hometown 이 배송지다. 지원서 맥락이 아니다
    expect: not-applicable
