[project]
name = "policyofficer"
version = "0.3.0.dev0"
description = "AI 가 코드를 읽어, 그 서비스에 걸릴 수 있는 국내 법 의무를 근거(파일:줄)와 함께 낸다"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    # 기능 신호 표(profile/features.yaml). YAML 1.2. pyyaml(1.1)은 yes/no/on/off 를 bool 로 강제변환해서 못 쓴다.
    "ruamel.yaml>=0.18",
]

[project.scripts]
policyofficer = "policyofficer.cli:main"

[dependency-groups]
dev = [
    # 시험이 review 결과를 schemas/review-2.json 으로 검사한다
    "jsonschema>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyofficer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 모델에게 보내는 프롬프트는 원문 그대로 유지한다. 줄을 자르면 모델 입력이 달라진다.
"src/policyofficer/review/prompts.py" = ["E501"]
